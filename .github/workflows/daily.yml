name: Daily ASX watchlist briefing

# GitHub's scheduler is best effort, not a clock. A run booked for 00:10 UTC
# has been starting at 03:18, 03:30, 03:44 and 03:47 UTC on consecutive days,
# so the briefing has been landing near 11:30 AWST instead of 08:10. Midnight
# UTC on the hour is the most heavily booked slot on the platform, and a job
# queued there waits behind everyone else's.
#
# Two changes fix it. First, nothing is scheduled at midnight UTC or on the
# hour any more. Second, the workflow no longer trusts its own start time: it
# is woken several times across the morning and the gate step below decides
# which of those wakes actually sends. A wake inside the window builds at
# once, sweeps again TOPUP_LEAD_MIN minutes before SEND_AT for anything lodged
# since, and sends on the minute; a wake that is late sends immediately; every
# wake after the day's briefing has gone out exits in about ten seconds.
#
# To test after changing files: Actions tab, "Run workflow", tick dry_run.
# It builds the whole briefing and sends nothing, claims nothing, archives
# nothing. Read the log; if it is clean, the next scheduled morning is live.
#
# The gate reads the lock from the remote branch and then claims the day with
# a tag before anything is sent. It cannot read it from its own checkout: a run
# is pinned to the commit that existed when GitHub created it, which for a wake
# queued behind a sleeping run is minutes older than the archive that run is
# about to push. That is what sent two emails on 12 August 2026.

on:
  schedule:
    # Times are UTC. AWST is UTC+8 all year, Perth has no daylight saving.
    # Wakes before 16:00 UTC belong to the same AWST day (1-5 = Mon-Fri).
    # Wakes at or after 16:00 UTC belong to the NEXT AWST day, so they run
    # Sun-Thu (0-4) to produce a Mon-Fri briefing.
    #
    # Every wake now sits BEFORE midnight UTC, and that is the whole point.
    # Measured against runs 88 to 108 over three consecutive days, the two
    # wakes booked before midnight started 9 to 18 minutes late, while the four
    # booked after it started 55 to 108 minutes late, every single day:
    #
    #     22:52 UTC ->  9 to  18 min late
    #     23:34 UTC -> 13 to  15 min late
    #     00:04 UTC -> 102 to 108 min late
    #     00:26 UTC ->  92 to 101 min late
    #     01:08 UTC ->  74 to  89 min late
    #     02:14 UTC ->  55 to  61 min late
    #
    # So four of the six wakes were arriving long after the 08:10 send and were
    # insurance in name only. One wake, 23:34, was doing all the work, and on
    # 27 August 2026 it was dropped during a GitHub Actions incident and the
    # briefing simply did not go out. Six wakes, one point of failure.
    #
    # The three at 23:17, 23:34 and 23:51 are the working set: at the observed
    # 15 minutes late they start at 07:32, 07:49 and 08:06 AWST, all inside the
    # 45 minute window where the gate waits for 08:10. The two earlier ones
    # cover a morning where the queue is deeper than usual. The two after
    # midnight are kept only as a floor, on the understanding that they will be
    # an hour late; late is better than never.
    - cron: "47 21 * * 0-4"     # 05:47 AWST, deep insurance
    - cron: "19 22 * * 0-4"     # 06:19 AWST, deep insurance
    - cron: "52 22 * * 0-4"     # 06:52 AWST
    - cron: "17 23 * * 0-4"     # 07:17 AWST, working set
    - cron: "34 23 * * 0-4"     # 07:34 AWST, working set
    - cron: "51 23 * * 0-4"     # 07:51 AWST, working set
    - cron: "26 0 * * 1-5"      # 08:26 AWST, floor, expect it an hour late
    - cron: "08 1 * * 1-5"      # 09:08 AWST, floor

  workflow_dispatch:        # lets anyone re-run it by hand from the Actions tab
    inputs:
      hours:
        description: "How many hours back to look"
        required: false
        default: "24"
      dry_run:
        description: "Build everything but send nothing (safe test after changing files)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write           # so the run can commit the day's archive and tag

# Only one run at a time. A second wake that arrives while one is in progress
# waits rather than running alongside it.
concurrency:
  group: daily-briefing
  cancel-in-progress: false

env:
  TZ: Australia/Perth
  SEND_AT: "08:10"          # the minute the briefing should leave, AWST
  PIN_WINDOW_MIN: "45"      # wake this close to SEND_AT and it waits for it
  TOPUP_LEAD_MIN: "6"       # sweep again this many minutes before SEND_AT

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 75     # allows for the wait, the run itself takes ~10 min
    steps:
      # ref is named explicitly so the checkout is the tip of the branch at the
      # moment this step runs, not the commit that triggered the wake.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Is this the run that sends?
        id: gate
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TODAY=$(date +%F)                       # AWST date, TZ is set above
          NOW=$(date +%s)
          TARGET=$(date -d "$TODAY $SEND_AT" +%s)

          # Has the day's briefing already gone out? Asked of the remote, never
          # of this checkout, which can be minutes stale.
          already_sent () {
            git fetch --quiet --depth=1 origin "$BRANCH" || return 1
            git cat-file -e "FETCH_HEAD:archive/${TODAY}-email.html" 2>/dev/null
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              echo "Manual DRY RUN. Building everything, sending nothing, claiming nothing."
              echo "send=yes" >> "$GITHUB_OUTPUT"
              echo "dry=yes" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Manual run. Sending now."
            echo "send=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if already_sent; then
            echo "archive/${TODAY}-email.html is already on $BRANCH. Nothing to do."
            echo "send=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # No sleeping here any more. A wake that is too early stands down and
          # leaves it to a later one; a wake inside the window starts building
          # straight away and run.py holds the finished email until SEND_AT.
          # The gate used to sleep until 08:10 and only then start collecting,
          # which put the whole build after the deadline and sent the email at
          # 08:10, 08:11 and 08:14 on three consecutive days.
          if [ "$NOW" -lt "$TARGET" ]; then
            WAIT=$(( TARGET - NOW ))
            if [ "$WAIT" -gt $(( PIN_WINDOW_MIN * 60 )) ]; then
              echo "Woke at $(date +%H:%M) AWST, too early. A later wake will send."
              echo "send=no" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Woke at $(date +%H:%M) AWST. Building now, sending at $SEND_AT."
          else
            echo "It is $(date +%H:%M) AWST, past $SEND_AT. Building and sending now."
          fi

          # Claim the day before sending, not after. Creating a git ref through
          # the API either creates it or fails with "Reference already exists",
          # and only one caller can be the one that created it. That is what
          # makes a second email impossible rather than merely unlikely.
          if OUT=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                     -f ref="refs/tags/sent-${TODAY}" \
                     -f sha="${GITHUB_SHA}" 2>&1); then
            echo "Claimed ${TODAY}. Sending."
            echo "send=yes" >> "$GITHUB_OUTPUT"
          elif echo "$OUT" | grep -qi "already exists"; then
            echo "Another run has already claimed ${TODAY}. Standing down."
            echo "send=no" >> "$GITHUB_OUTPUT"
          else
            echo "Could not claim ${TODAY}, so this run will not send:"
            echo "$OUT"
            echo "send=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.send == 'yes'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.send == 'yes'

      - name: Choose the lookback window
        id: window
        if: steps.gate.outputs.send == 'yes'
        run: |
          # A manual run uses whatever was typed in the box. A scheduled run
          # uses 24 hours, except on Monday, which reaches back 72 to pick up
          # Friday's session and the weekend. The day is read in AWST, because
          # a run that woke on Sunday evening UTC is a Monday briefing.
          HOURS="${{ github.event.inputs.hours }}"
          if [ -z "$HOURS" ]; then
            HOURS=24
            [ "$(date +%u)" = "1" ] && HOURS=72
          fi
          echo "hours=$HOURS" >> "$GITHUB_OUTPUT"
          echo "Looking back $HOURS hours."

      - name: Build and send the briefing
        id: build
        if: steps.gate.outputs.send == 'yes'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          if [ "${{ steps.gate.outputs.dry }}" = "yes" ]; then
            python run.py --hours ${{ steps.window.outputs.hours }} --dry-run
          else
            python run.py --hours ${{ steps.window.outputs.hours }} --send-at "$SEND_AT"
          fi

      # The archive is the program's only memory: tomorrow reads it to know
      # where today stopped and what was already reported. A push that fails
      # here means tomorrow repeats today's items (a visible fault, and the
      # right direction to fail in), so it is tried three times and shouted
      # about if it still does not land. A dry run writes nothing back: it
      # produced files for today that were never sent, and previous_run()
      # only trusts a pack with an email beside it, so keeping them would be
      # harmless but pointless.
      - name: Keep the day's evidence
        if: always() && steps.gate.outputs.send == 'yes' && steps.gate.outputs.dry != 'yes'
        run: |
          git config user.name "watchlist-bot"
          git config user.email "actions@github.com"
          git add archive/*.json archive/*.html 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing new to archive."
            exit 0
          fi
          git commit -m "archive: $(date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash && git push && { echo "Archive pushed."; exit 0; }
            echo "Push attempt $attempt failed, retrying in 20s..."
            sleep 20
          done
          echo "::error::ARCHIVE PUSH FAILED after 3 attempts. Today's pack is not on"
          echo "::error::the branch, so tomorrow's run will not know these items were"
          echo "::error::sent and will report them again. Re-run this workflow by hand"
          echo "::error::later, or push the archive directory manually."
          exit 0

      # If the send failed, the day was claimed but nothing was delivered, and
      # a claim nobody honoured would silence every later wake. Hand it back so
      # 08:26, 09:08 and 10:14 can still try. Remove this step if you would
      # rather a failed morning stay silent than risk a second copy of a
      # briefing that failed after the mail server had already accepted it.
      - name: Release the claim if the send failed
        if: failure() && steps.gate.outputs.send == 'yes' && steps.gate.outputs.dry != 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/sent-$(date +%F)" || true
