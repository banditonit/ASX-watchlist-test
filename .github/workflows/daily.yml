name: Daily ASX watchlist briefing

on:
  schedule:
    # 00:10 UTC = 08:10 AWST, ten minutes after the ASX open, so the opening
    # batch of announcements is already lodged. Perth does not observe daylight
    # saving, so this holds all year without seasonal adjustment.
    #
    # Weekdays only. The ASX does not trade at the weekend, so Saturday and
    # Sunday runs would spend credit to report nothing. Monday compensates by
    # looking back 72 hours instead of 24, which covers Friday's session and
    # anything lodged over the weekend. That widening happens in the run step
    # below, not here.
    #
    # GitHub can start a scheduled job a few minutes late at busy times. That is
    # harmless: a later start only widens the capture window slightly.
    - cron: "10 0 * * 1-5"

  workflow_dispatch:        # lets anyone re-run it by hand from the Actions tab
    inputs:
      hours:
        description: "How many hours back to look"
        required: false
        default: "24"

permissions:
  contents: write           # so the run can commit the day's archive

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Choose the lookback window
        id: window
        run: |
          # A manual run uses whatever was typed in the box. A scheduled run
          # uses 24 hours, except on Monday, which reaches back 72 to pick up
          # Friday's session and the weekend.
          HOURS="${{ github.event.inputs.hours }}"
          if [ -z "$HOURS" ]; then
            HOURS=24
            [ "$(date -u +%u)" = "1" ] && HOURS=72
          fi
          echo "hours=$HOURS" >> "$GITHUB_OUTPUT"
          echo "Looking back $HOURS hours."

      - name: Build and send the briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python run.py --hours ${{ steps.window.outputs.hours }}

      - name: Keep the day's evidence
        if: always()
        run: |
          git config user.name "watchlist-bot"
          git config user.email "actions@github.com"
          git add archive/*.json archive/*.html 2>/dev/null || true
          git diff --staged --quiet || git commit -m "archive: $(date -u +%Y-%m-%d)"
          git push || true

