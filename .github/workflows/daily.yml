name: Daily ASX watchlist briefing

# GitHub's scheduler is best effort, not a clock. A run booked for 00:10 UTC
# has been starting at 03:18, 03:30, 03:44 and 03:47 UTC on consecutive days,
# so the briefing has been landing near 11:30 AWST instead of 08:10. Midnight
# UTC on the hour is the most heavily booked slot on the platform, and a job
# queued there waits behind everyone else's.
#
# Two changes fix it. First, nothing is scheduled at midnight UTC or on the
# hour any more. Second, the workflow no longer trusts its own start time: it
# is woken several times across the morning and the gate step below decides
# which of those wakes actually sends. A wake that is early sleeps until 08:10
# exactly; a wake that is late sends immediately; every wake after the day's
# briefing has gone out exits in about ten seconds.
#
# The gate reads the lock from the remote branch and then claims the day with
# a tag before anything is sent. It cannot read it from its own checkout: a run
# is pinned to the commit that existed when GitHub created it, which for a wake
# queued behind a sleeping run is minutes older than the archive that run is
# about to push. That is what sent two emails on 12 August 2026.

on:
  schedule:
    # Times are UTC. AWST is UTC+8 all year, Perth has no daylight saving.
    # Wakes before 16:00 UTC belong to the same AWST day (1-5 = Mon-Fri).
    # Wakes at or after 16:00 UTC belong to the NEXT AWST day, so they run
    # Sun-Thu (0-4) to produce a Mon-Fri briefing.
    - cron: "52 22 * * 0-4"     # 06:52 AWST, insurance
    - cron: "34 23 * * 0-4"     # 07:34 AWST, sleeps 36 min, sends at 08:10
    - cron: "04 0 * * 1-5"      # 08:04 AWST, sleeps 6 min, sends at 08:10
    - cron: "26 0 * * 1-5"      # 08:26 AWST, catches a late start
    - cron: "08 1 * * 1-5"      # 09:08 AWST, catches a later one
    - cron: "14 2 * * 1-5"      # 10:14 AWST, last resort

  workflow_dispatch:        # lets anyone re-run it by hand from the Actions tab
    inputs:
      hours:
        description: "How many hours back to look"
        required: false
        default: "24"

permissions:
  contents: write           # so the run can commit the day's archive and tag

# Only one run at a time. A second wake that arrives while one is in progress
# waits rather than running alongside it.
concurrency:
  group: daily-briefing
  cancel-in-progress: false

env:
  TZ: Australia/Perth
  SEND_AT: "08:10"          # the minute the briefing should leave, AWST
  PIN_WINDOW_MIN: "45"      # wake this close to SEND_AT and it waits for it

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 75     # allows for the wait, the run itself takes ~10 min
    steps:
      # ref is named explicitly so the checkout is the tip of the branch at the
      # moment this step runs, not the commit that triggered the wake.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Is this the run that sends?
        id: gate
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TODAY=$(date +%F)                       # AWST date, TZ is set above
          NOW=$(date +%s)
          TARGET=$(date -d "$TODAY $SEND_AT" +%s)

          # Has the day's briefing already gone out? Asked of the remote, never
          # of this checkout, which can be minutes stale.
          already_sent () {
            git fetch --quiet --depth=1 origin "$BRANCH" || return 1
            git cat-file -e "FETCH_HEAD:archive/${TODAY}-email.html" 2>/dev/null
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run. Sending now."
            echo "send=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if already_sent; then
            echo "archive/${TODAY}-email.html is already on $BRANCH. Nothing to do."
            echo "send=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$NOW" -lt "$TARGET" ]; then
            WAIT=$(( TARGET - NOW ))
            if [ "$WAIT" -gt $(( PIN_WINDOW_MIN * 60 )) ]; then
              echo "Woke at $(date +%H:%M) AWST, too early. A later wake will send."
              echo "send=no" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Woke at $(date +%H:%M) AWST. Waiting ${WAIT}s to send at $SEND_AT."
            sleep "$WAIT"
          else
            echo "It is $(date +%H:%M) AWST, past $SEND_AT."
          fi

          # A sleeping run knows nothing about what happened while it slept, so
          # the question is asked again on waking.
          if already_sent; then
            echo "Another run sent the briefing while this one waited."
            echo "send=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Claim the day before sending, not after. Creating a git ref through
          # the API either creates it or fails with "Reference already exists",
          # and only one caller can be the one that created it. That is what
          # makes a second email impossible rather than merely unlikely.
          if OUT=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                     -f ref="refs/tags/sent-${TODAY}" \
                     -f sha="${GITHUB_SHA}" 2>&1); then
            echo "Claimed ${TODAY}. Sending."
            echo "send=yes" >> "$GITHUB_OUTPUT"
          elif echo "$OUT" | grep -qi "already exists"; then
            echo "Another run has already claimed ${TODAY}. Standing down."
            echo "send=no" >> "$GITHUB_OUTPUT"
          else
            echo "Could not claim ${TODAY}, so this run will not send:"
            echo "$OUT"
            echo "send=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.send == 'yes'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.send == 'yes'

      - name: Choose the lookback window
        id: window
        if: steps.gate.outputs.send == 'yes'
        run: |
          # A manual run uses whatever was typed in the box. A scheduled run
          # uses 24 hours, except on Monday, which reaches back 72 to pick up
          # Friday's session and the weekend. The day is read in AWST, because
          # a run that woke on Sunday evening UTC is a Monday briefing.
          HOURS="${{ github.event.inputs.hours }}"
          if [ -z "$HOURS" ]; then
            HOURS=24
            [ "$(date +%u)" = "1" ] && HOURS=72
          fi
          echo "hours=$HOURS" >> "$GITHUB_OUTPUT"
          echo "Looking back $HOURS hours."

      - name: Build and send the briefing
        id: build
        if: steps.gate.outputs.send == 'yes'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python run.py --hours ${{ steps.window.outputs.hours }}

      - name: Keep the day's evidence
        if: always() && steps.gate.outputs.send == 'yes'
        run: |
          git config user.name "watchlist-bot"
          git config user.email "actions@github.com"
          git add archive/*.json archive/*.html 2>/dev/null || true
          git diff --staged --quiet || git commit -m "archive: $(date +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push || true

      # If the send failed, the day was claimed but nothing was delivered, and
      # a claim nobody honoured would silence every later wake. Hand it back so
      # 08:26, 09:08 and 10:14 can still try. Remove this step if you would
      # rather a failed morning stay silent than risk a second copy of a
      # briefing that failed after the mail server had already accepted it.
      - name: Release the claim if the send failed
        if: failure() && steps.gate.outputs.send == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/sent-$(date +%F)" || true
